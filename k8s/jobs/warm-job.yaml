apiVersion: batch/v1
kind: Job
metadata:
  name: flash-sale-warm
  namespace: flash-sale
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: redis-warm
          image: flash-sale-ops:local
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "-w", "@workspace/redis", "redis:warm"]
          envFrom:
            - configMapRef:
                name: flash-sale-config
            - secretRef:
                name: flash-sale-secrets
