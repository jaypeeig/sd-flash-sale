apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flash-sale
resources:
  - ../../base

configMapGenerator:
  - name: flash-sale-config
    literals:
      - POSTGRES_DB=flashsale
      - API_PORT=3000
      - REDIS_URL=redis://redis:6379
    options:
      disableNameSuffixHash: true

# XXX: Local-only credentials matching docker-compose.yml's defaults.
secretGenerator:
  - name: flash-sale-secrets
    literals:
      - POSTGRES_USER=flashsale
      - POSTGRES_PASSWORD=flashsale
      # DATABASE_URL duplicates POSTGRES_USER/PASSWORD above — kustomize
      # generators can't interpolate between literals, so this has to be
      # kept in sync by hand
      - DATABASE_URL=postgresql://flashsale:flashsale@postgres:5432/flashsale
      - RABBITMQ_DEFAULT_USER=flashsale
      - RABBITMQ_DEFAULT_PASS=flashsale
      # RABBITMQ_URL duplicates RABBITMQ_DEFAULT_USER/PASS above — same
      # manual-sync caveat as DATABASE_URL.
      - RABBITMQ_URL=amqp://flashsale:flashsale@rabbitmq:5672
    options:
      disableNameSuffixHash: true
